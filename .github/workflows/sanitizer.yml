name: Native sanitizers and managed-code checks

on:
  push:
    branches: [main, master]
    paths:
      - "Native/**"
      - "Runtime/**"
      - "Editor/**"
      - ".github/workflows/sanitizer.yml"
  pull_request:
    paths:
      - "Native/**"
      - "Runtime/**"
      - "Editor/**"
      - ".github/workflows/sanitizer.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  managed-static-analysis:
    name: C# source and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate C# source formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("Runtime").rglob("*.cs")) + list(Path("Editor").rglob("*.cs"))
          if not files:
              raise SystemExit("No C# source files found.")
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "\x00" in text:
                  raise SystemExit(f"Unexpected NUL byte in {path}")
              if not text.endswith("\n"):
                  raise SystemExit(f"Missing final newline: {path}")
              print(f"Checked {path}")
          PY

      - name: Check package and assembly JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("package.json").read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.asmdef"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          PY

  native-sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Detect native Moss adapter
        id: detect
        shell: bash
        run: |
          if [ -f Native/CMakeLists.txt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "source_dir=Native" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No native C++ adapter is maintained in MossUnity. Native memory sanitizers belong in Moss/MossSharp's native build."
          fi

      - name: Install native build tools
        if: steps.detect.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configure native adapter with sanitizers
        if: steps.detect.outputs.available == 'true'
        run: |
          cmake -S "${{ steps.detect.outputs.source_dir }}" -B build-sanitized \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMOSS_ENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON

      - name: Build native adapter
        if: steps.detect.outputs.available == 'true'
        run: cmake --build build-sanitized --parallel

      - name: Run native tests under sanitizers
        if: steps.detect.outputs.available == 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure
