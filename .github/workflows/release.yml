name: Release MossUnity

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Validate and publish Unity package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag matches package version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package metadata and assemblies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("package.json").read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.asmdef"):
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Create Unity Package Manager archive
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/MossUnity-${{ steps.version.outputs.version }}.zip" \
            package.json README.md LICENSE Runtime Editor 'Documentation~' \
            -x '*/.DS_Store'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MossUnity v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/MossUnity-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
